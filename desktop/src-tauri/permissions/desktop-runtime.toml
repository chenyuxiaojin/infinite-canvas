[[permission]]
identifier = "desktop-runtime"
description = "Allow the fixed loopback canvas to use the closed desktop probe and deterministic acceptance-task API."
commands.allow = [
  "probe_desktop_runtime",
  "generate_desktop_test_clip",
  "generate_canvas_test_clip",
  "desktop_task_status",
  "desktop_task_media",
  "cancel_desktop_task",
  "desktop_canvas_projects",
  "desktop_canvas_project_ids",
  "desktop_canvas_document",
  "desktop_canvas_deleted_ids",
  "desktop_canvas_project",
  "save_desktop_canvas_project",
  "delete_desktop_canvas_projects",
  "desktop_canvas_project_revision",
  "desktop_canvas_history",
  "desktop_canvas_history_preview",
  "desktop_canvas_history_restore",
  "read_canvas_local_image",
  "read_canvas_local_media",
  "resolve_canvas_project_workspace",
  "inspect_canvas_project_bindings",
  "select_film_directory",
  "bind_canvas_project_directory",
  "save_canvas_export",
  "pty_spawn",
  "pty_ack",
  "pty_write",
  "pty_resize",
  "pty_terminate",
  "canvas_local_agent_open",
  "canvas_local_agent_send",
  "canvas_local_agent_respond",
  "canvas_local_agent_permission",
  "canvas_local_agent_close",
  "canvas_codex_open",
  "canvas_codex_send",
  "canvas_codex_close",
]

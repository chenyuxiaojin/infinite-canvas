[package]
name = "infinite-canvas-desktop"
version = "0.5.5"
description = "A local-first macOS shell for infinite-canvas"
authors = ["chenyuxiaojin and infinite-canvas contributors"]
license = "MIT"
repository = "https://github.com/chenyuxiaojin/infinite-canvas"
edition = "2021"
rust-version = "1.85"

[features]
integration-acceptance = []

[lib]
name = "infinite_canvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = "0.7.9"
bytes = "1"
external-connectors = { package = "infinite-canvas-external-connectors", path = "../../integrations/external-connectors-rust" }
getrandom = "0.3"
local-ai-audio = { path = "../../integrations/local-ai-audio-rust" }
local-agent-adapter = { package = "infinite-canvas-local-agent-adapter", path = "../../integrations/local-agent-adapter-rust" }
local-executor = { package = "infinite-canvas-local-executor", path = "../../integrations/local-executor-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2.3.5"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

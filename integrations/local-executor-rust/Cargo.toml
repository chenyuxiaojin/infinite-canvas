[package]
name = "infinite-canvas-local-executor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Allowlisted local media executor for the infinite-canvas macOS director console"

[lib]
name = "local_executor"
path = "src/lib.rs"

[[bin]]
name = "local-executor-demo"
path = "src/bin/local-executor-demo.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

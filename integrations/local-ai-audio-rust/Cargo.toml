[package]
name = "local-ai-audio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Restricted local IndexTTS-2.5 and VoxCPM2 discovery and acceptance layer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "local_ai_audio"
path = "src/lib.rs"

[[bin]]
name = "local-ai-audio"
path = "src/main.rs"
